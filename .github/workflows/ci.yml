name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [ '10.0.x', '11.0.x' ]
    name: Run unit tests for Dotnet ${{ matrix.dotnet }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        id: stepid
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Replace global.json
        run: |
          set -e
          rm -f TinyCsvParser/global.json
          printf '%s' '{"sdk":{"version":"${{ steps.stepid.outputs.dotnet-version }}"},"test":{"runner":"Microsoft.Testing.Platform"}}' > TinyCsvParser/global.json
      - name: Build project
        run: dotnet build TinyCsvParser
      - name: Run unit tests
        working-directory: ./TinyCsvParser/TinyCsvParser.Test
        run: dotnet test --no-build --no-restore --verbosity normal
