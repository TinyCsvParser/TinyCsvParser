name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Run unit tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build project
        run: dotnet build TinyCsvParser
      - name: Run unit tests
        working-directory: ./TinyCsvParser/TinyCsvParser.Test
        run: dotnet test --no-build --no-restore --verbosity normal
